services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./backend/.env
    entrypoint:
      - sh
      - -c
      - 'export POSTGRES_DB="$${POSTGRES_DB:-$$DB_NAME}" POSTGRES_USER="$${POSTGRES_USER:-$$DB_USER}" POSTGRES_PASSWORD="$${POSTGRES_PASSWORD:-$$DB_PASSWORD}" && exec docker-entrypoint.sh postgres'
    ports:
      - "5432:5432"
    volumes:
      - bizpulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  bizpulse_pgdata: